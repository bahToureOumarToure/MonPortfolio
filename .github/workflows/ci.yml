name: CI

# Garde-fou avant toute mise en production : chaque push (toutes branches) et
# chaque PR vers main doivent passer lint + typecheck + build sur une vraie base
# Postgres seedée. Vercel ne promeut en prod que ce qui est mergé dans main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/portfolio
  AUTH_SECRET: ci-only-secret-not-used-in-production
  ADMIN_EMAIL: ci@example.com
  E2E_ADMIN_PASSWORD: ci-e2e-password-not-secret
  # Voir next.config.ts : contourne un blocage de l'optimiseur d'images de
  # `next start` (absent en prod, où Vercel optimise les images).
  DISABLE_IMAGE_OPTIMIZATION: "1"

jobs:
  quality:
    name: Lint · Typecheck · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Garde-fou « ne pas casser la prod » : on reconstruit une base au schéma
      # actuellement en production (main), on y applique les migrations
      # additives (prisma/sql) exactement comme au build Vercel, puis on vérifie
      # qu'il ne reste aucun écart avec le nouveau schéma.
      - name: Simulation de la mise à jour de la base de prod
        run: |
          git fetch --no-tags --depth=1 origin main
          git show origin/main:prisma/schema.prisma > "$RUNNER_TEMP/prod-schema.prisma"
          npx prisma db push --skip-generate --schema "$RUNNER_TEMP/prod-schema.prisma"
          node scripts/db-sync.mjs --strict
          npx prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Schéma Prisma → base de test
        run: npx prisma db push --skip-generate

      - name: Seed
        run: npm run db:seed

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'utils/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Compte admin de test
        run: node scripts/e2e-admin.mjs

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      # Parcours réels sur le build de prod : site public (thème clair par
      # défaut, mobile, projets, contact, SEO) et admin (connexion, CRUD,
      # validation, thème, uploads).
      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Rapport e2e (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
